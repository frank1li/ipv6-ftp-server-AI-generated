name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality & Tests

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install format check dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort
      working-directory: .

    - name: Check code formatting
      run: |
        chmod +x scripts/format_check.sh
        CI=true ./scripts/format_check.sh --check
      working-directory: .

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build and test
      run: |
        docker build -t ftp-server-test -f Dockerfile.test .
        docker run --rm ftp-server-test