name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality & Tests

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Check code formatting
      run: |
        chmod +x scripts/format_check.sh
        ./scripts/format_check.sh --check
      working-directory: .

    - name: Build and test
      run: |
        docker build -t ftp-server-test -f Dockerfile.test .
        docker run --rm ftp-server-test